name: Update counter every x minutes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-counter
  cancel-in-progress: false   # queue instead of cancel  

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python update_counter.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add counter.txt
          git commit -m "Auto update counter" || exit 0

          # Rebase onto latest main, then push (retry a few times)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)
            git push && break
            echo "Push failed (attempt $i). Retrying..."
            sleep 2
          done
